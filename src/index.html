    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="panell">

    <!-- Formulari d'entrada de dades -->
    <div class="card">
        <h2>Afegir Nou Equip</h2>

        <div class="field">
            <label for="iNom">Nom de l'equip:</label>
            <input type="text" id="iNom" placeholder="Escriu un nom...">
        </div>

        <div class="field">
            <label for="iPartitsjugats">Partits jugats:</label>
            <input type="number" id="iPartitsjugats" value="0">
        </div>

        <div class="field">
            <label for="iPunts">Punts:</label>
            <input type="number" id="iPunts" value="0">
        </div>

        <div class="field">
            <label for="iGolsfavor">Gols a favor:</label>
            <input type="number" id="iGolsfavor" value="0">
        </div>

        <div class="field">
            <label for="iGolscontra">Gols en contra:</label>
            <input type="number" id="iGolscontra" value="0">
        </div>


        <button id="btnAfegir">Afegir a la Llista</button>


    </div>

    <div id="contenidorEquips"></div>

    <div>


    </div>

</div>

<script src="app.js"></script>
